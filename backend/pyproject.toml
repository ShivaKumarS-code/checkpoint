[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "checkpoint-ai"
version = "0.1.0"
description = "Deterministic replay and fork debugger for AI agents"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["agents", "debugging", "llm", "replay", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "msgspec>=0.18",
    "pyyaml>=6",
    "rich>=13.7",
    "time-machine>=2.14",
    "typer>=0.12",
    "uvicorn>=0.30",
    "websockets>=12",
    "wrapt>=1.16",
    "zstandard>=0.22",
]

[project.scripts]
checkpoint = "checkpoint.cli:main"

[project.urls]
Homepage = "https://github.com/ShivaKumarS-code/checkpoint"
Repository = "https://github.com/ShivaKumarS-code/checkpoint"
Issues = "https://github.com/ShivaKumarS-code/checkpoint/issues"

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["checkpoint"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"checkpoint/cli.py" = ["B008"]

[tool.pyright]
include = ["checkpoint", "examples", "tests"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
