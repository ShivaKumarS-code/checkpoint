# Example checkpoint config for the refund agent demo.
# Extra masks are applied to string values in addition to the built-in
# ISO-timestamp and UUID masks.

[[masks]]
pattern = "sess_[0-9a-zA-Z]{8,}"
replacement = "<session>"

# Upstream base URL used by `checkpoint run` when neither --upstream nor
# CHECKPOINT_UPSTREAM_URL is set. Defaults to the demo fake LLM.
# upstream_url = "http://127.0.0.1:4141"

# Extra redaction patterns are applied in addition to the built-in ones.
# [[redaction]]
# pattern = "my-secret-[0-9]+"

# Freeze the agent clock at the run start and advance it at each boundary.
# Set to false only if normalization masks every volatile timestamp.
# freeze_clock = true

# What to do when replay finds no matching recorded step. "strict" marks the
# run DIVERGED; "live" executes the call and records it with source LIVE.
# Stub tools always use the strict behavior and never execute during replay.
# [replay]
# llm_miss_policy = "strict"
# tool_miss_policy = "strict"
# checkpoint_miss_policy = "strict"

# Opt-in semantic replay matching. Disabled by default. Only the named LLM
# step boundaries are eligible. A local embedding score is tried first; set
# judge = true to ask a small OpenAI-compatible model to confirm each hit.
# [semantic]
# enabled = true
# step_names = ["plan"]
# threshold = 0.92
# judge = false
# judge_model = "gpt-4o-mini"

# Tier 2 rubric checks use this OpenAI-compatible model by default. A check can
# override it with `model:` in variants.yaml. Point upstream_url at a local
# server to keep judge calls local.
# [tier2]
# model = "gpt-4o-mini"
# temperature = 0.0
# max_tokens = 512
